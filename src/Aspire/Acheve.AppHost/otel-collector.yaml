# OpenTelemetry Collector used in local development.
# Every service sends its telemetry here, and the collector sends a copy to the Aspire dashboard
# and another to the Grafana LGTM container (Tempo, Loki and Prometheus).
# It also scrapes the RabbitMQ Prometheus endpoint and sends those metrics to LGTM only.
# The AppHost sets the endpoints, the API key and the receiver ports through environment variables and arguments.

receivers:
  otlp:
    protocols:
      # Listen on all interfaces so the services can reach the container through its mapped ports.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/rabbitmq:
    config:
      scrape_configs:
        # Totals for the whole broker (connections, channels, published and delivered messages).
        - job_name: rabbitmq
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:RABBITMQ_PROMETHEUS_ENDPOINT}"]
        # Per-queue depth and consumers, labelled with the queue name.
        - job_name: rabbitmq-queues
          scrape_interval: 15s
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics, queue_consumer_count]
          static_configs:
            - targets: ["${env:RABBITMQ_PROMETHEUS_ENDPOINT}"]

processors:
  batch:
  # The .NET SDK sends its own telemetry as "dotnet-cli" when the OTLP variables are set (dotnet run, build, watch).
  # It is not part of the system, so drop it before it reaches the dashboards.
  filter/dotnet-cli:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.name"] == "dotnet-cli"
    metrics:
      metric:
        - resource.attributes["service.name"] == "dotnet-cli"
    logs:
      log_record:
        - resource.attributes["service.name"] == "dotnet-cli"

  # The on-call Grafana (lgtm-oncall) gets a copy with only what a real team would see: our own services, without
  # the faults injected on purpose. It is where an AI agent investigates incidents (talk E5), so the answer must not
  # be in its data. The external systems never reach it: their own collector only sends to lgtm.
  # Only the services of the application; the tools (traffic generator, chaos monkey) are not part of a real system.
  filter/oncall-application:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.namespace"] != "application"
    metrics:
      metric:
        - resource.attributes["service.namespace"] != "application"
    logs:
      log_record:
        - resource.attributes["service.namespace"] != "application"
  # Injected faults and paused workers don't announce themselves in real life: drop their metrics and the chaos logs
  # (the Api runs chaos on its /callbacks endpoints).
  filter/oncall-chaos:
    error_mode: ignore
    metrics:
      metric:
        - IsMatch(name, "^chaos\\.")
        - name == "consumption.paused"
    logs:
      log_record:
        - IsMatch(instrumentation_scope.name, "^Acheve\\.Common\\.Chaos")
  # The spans stay; only the tag that says a fault was injected goes.
  transform/oncall-chaos:
    error_mode: ignore
    trace_statements:
      - delete_key(span.attributes, "chaos.injected")

exporters:
  otlp_grpc/aspire:
    endpoint: ${env:ASPIRE_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      # The dashboard uses the ASP.NET Core development certificate, which the container does not trust.
      insecure_skip_verify: true
  otlp_grpc/lgtm:
    endpoint: ${env:LGTM_OTLP_ENDPOINT}
    tls:
      insecure: true
  otlp_grpc/oncall:
    endpoint: ${env:ONCALL_OTLP_ENDPOINT}
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/dotnet-cli, batch]
      exporters: [otlp_grpc/aspire, otlp_grpc/lgtm]
    metrics:
      receivers: [otlp]
      processors: [filter/dotnet-cli, batch]
      exporters: [otlp_grpc/aspire, otlp_grpc/lgtm]
    metrics/rabbitmq:
      receivers: [prometheus/rabbitmq]
      processors: [batch]
      exporters: [otlp_grpc/lgtm]
    logs:
      receivers: [otlp]
      processors: [filter/dotnet-cli, batch]
      exporters: [otlp_grpc/aspire, otlp_grpc/lgtm]
    # The filtered copy for the on-call Grafana.
    traces/oncall:
      receivers: [otlp]
      processors: [filter/dotnet-cli, filter/oncall-application, transform/oncall-chaos, batch]
      exporters: [otlp_grpc/oncall]
    metrics/oncall:
      receivers: [otlp]
      processors: [filter/dotnet-cli, filter/oncall-application, filter/oncall-chaos, batch]
      exporters: [otlp_grpc/oncall]
    logs/oncall:
      receivers: [otlp]
      processors: [filter/dotnet-cli, filter/oncall-application, filter/oncall-chaos, batch]
      exporters: [otlp_grpc/oncall]
    # The broker is ours: its scraped metrics have no service.namespace, so they skip the application filter.
    metrics/rabbitmq-oncall:
      receivers: [prometheus/rabbitmq]
      processors: [batch]
      exporters: [otlp_grpc/oncall]
