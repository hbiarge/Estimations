# Grafana alert rules for the Estimations system, loaded on every start.
# They show in Grafana under Alerting > Alert rules. No contact point is set up, so they only notify inside Grafana.
# Each rule links to the dashboard panel that explains it.
apiVersion: 1

groups:
  - orgId: 1
    name: Messaging
    folder: Estimations
    interval: 1m
    rules:
      - uid: estimations-error-queue
        title: Messages in the error queue
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rabbitmq_detailed_queue_messages{queue="error"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $values.A.Value }} message(s) in the Rebus error queue"
          description: >-
            Rebus moved messages to the error queue after its retries failed, so at least one case stopped moving.
            Check the handler failures and the error logs, fix the cause, then move the messages back
            from the 'error' queue in the RabbitMQ management UI.
          __dashboardUid__: estimations-messaging
          __panelId__: "2"

      - uid: estimations-queue-backlog
        title: Queue backlog
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (queue) (rabbitmq_detailed_queue_messages_ready{queue!="error"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $values.A.Value }} messages waiting in queue {{ $labels.queue }}"
          description: >-
            Messages have been piling up in this queue for 5 minutes. The service that reads it is down,
            stuck, or too slow for the load.
          __dashboardUid__: estimations-messaging
          __panelId__: "6"

  - orgId: 1
    name: Services
    folder: Estimations
    interval: 1m
    rules:
      - uid: estimations-service-down
        title: Service down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Services seen in the last hour that sent nothing in the last 2 minutes, plus a failed RabbitMQ scrape.
              # The tools (traffic generator, chaos monkey) and the LGTM container's own collector are not services.
              # A service running the down chaos scenario fails every request, so it counts as down too (value 2).
              expr: >-
                (group by (service_name) (max_over_time(target_info{service_name!~"otelcol-contrib|trafficgenerator|chaosmonkey"}[1h]))
                  unless group by (service_name) (max_over_time(target_info[2m])))
                or
                (group by (service_name) (up{job=~"rabbitmq.*"} == 0))
                or
                (group by (service_name) (chaos_scenario_active{chaos_scenario="down"} == 1) * 2)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ if eq $values.A.Value 2.0 }}{{ $labels.service_name }} is in the down chaos scenario{{ else }}{{ $labels.service_name }} stopped sending telemetry{{ end }}
          description: >-
            {{ if eq $values.A.Value 2.0 }}The down chaos scenario makes this service fail every request. Switch it back
            to healthy with its chaos command in the Aspire dashboard, or wait for the chaos monkey's next step.{{ else }}No
            telemetry from this service for the last 2 minutes. It crashed, failed to start, or cannot reach
            the collector. Check its state and console logs in the Aspire dashboard.{{ end }}
          __dashboardUid__: estimations-runtime
          __panelId__: "2"

  - orgId: 1
    name: Edges
    folder: Estimations
    interval: 1m
    rules:
      - uid: estimations-api-5xx
        title: Api 5xx ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(http_server_request_duration_seconds_count{service_name="api", http_response_status_code=~"5.."}[5m]))
                / sum(rate(http_server_request_duration_seconds_count{service_name="api"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ humanizePercentage $values.A.Value }} of Api requests fail with a 5xx"
          description: >-
            More than 5% of Api requests (client calls and external callbacks) failed with a server error
            over the last 5 minutes. Look at the failing route and its traces.
          __dashboardUid__: estimations-edges
          __panelId__: "5"

      - uid: estimations-external-failures
        title: External system failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum by (client, server) (rate(traces_service_graph_request_failed_total{server=~"external-.*", client!="user"}[5m]))
                / sum by (client, server) (rate(traces_service_graph_request_total{server=~"external-.*", client!="user"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ humanizePercentage $values.A.Value }} of calls from {{ $labels.client }} to {{ $labels.server }} fail"
          description: >-
            More than 20% of the calls to this external system failed over the last 5 minutes. Calls that still fail
            after the HTTP retries end as UnableTo… messages, so images or whole cases fail.
          __dashboardUid__: estimations-edges
          __panelId__: "12"

      - uid: estimations-rejected-callbacks
        title: Rejected callbacks
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(http_server_request_duration_seconds_count{service_name="api", http_route=~"/callbacks/.*", http_response_status_code=~"4.."}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The Api rejected {{ printf \"%.0f\" $values.A.Value }} callback(s) in the last 5 minutes"
          description: >-
            Callbacks were refused with a 4xx (bad or missing signature or traceparent). The saga never gets those
            results and the cases will time out. Usually the callback signing key changed (user secrets reset)
            while cases were running, or someone is calling the callback URLs directly.
          __dashboardUid__: estimations-edges
          __panelId__: "6"

  - orgId: 1
    name: Cases
    folder: Estimations
    interval: 1m
    rules:
      - uid: estimations-case-failure-rate
        title: Case failure rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Needs at least 5 finished cases, so one failure out of two doesn't fire it.
              expr: >-
                (sum(increase(estimations_cases_finished_total{estimation_result="failure"}[15m]))
                  / sum(increase(estimations_cases_finished_total[15m])))
                and on () (sum(increase(estimations_cases_finished_total[15m])) >= 5)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ humanizePercentage $values.A.Value }} of the cases finished in the last 15 minutes failed"
          description: >-
            More than 20% of the finished cases got no estimation. The Case flow dashboard shows why
            (no valid images, estimation rejected or estimation timeout).
          __dashboardUid__: estimations-case-flow
          __panelId__: "3"

      - uid: estimations-slow-cases
        title: Slow cases
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(estimations_case_duration_seconds_bucket[15m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [180] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "95% of cases take up to {{ humanizeDuration $values.A.Value }}"
          description: >-
            A case normally takes about 25 s. Over 3 minutes means cases are waiting for timeouts or messages are
            piling up. Check the time spent in each state on the Case flow dashboard.
          __dashboardUid__: estimations-overview
          __panelId__: "9"

      - uid: estimations-stuck-case
        title: Stuck case
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(estimations_cases_oldest_active_age_seconds)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1200] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "A case has been running for {{ humanizeDuration $values.A.Value }}"
          description: >-
            Every wait has a timeout and the worst case (every wait timing out and every notification retry failing)
            ends in about 15 minutes, so a case running for more than 20 minutes is stuck: the process manager is
            down or behind, or the saga has a bug. Find the case on the Cases running per
            state panel and follow its trace.
          __dashboardUid__: estimations-overview
          __panelId__: "6"

      - uid: estimations-wait-timeouts
        title: Wait timeouts
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(estimations_images_finished_total{estimation_image_result=~"download_timeout|analysis_timeout"}[10m]))
                + sum(increase(estimations_cases_finished_total{estimation_failure_reason="estimation_timeout"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # increase() extrapolates, so one timeout can read as slightly less than 1.
                - evaluator: { type: gt, params: [0.5] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ printf \"%.0f\" $values.A.Value }} wait(s) timed out in the last 10 minutes"
          description: >-
            The saga asked for a download, an image analysis or an estimation and the result never arrived, so it
            gave up after about 2 minutes. Either the worker never answered (check the error queue), the external
            service didn't call back, or the Api rejected the callback.
          __dashboardUid__: estimations-case-flow
          __panelId__: "9"
